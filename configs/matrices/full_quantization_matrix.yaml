name: full_quantization_matrix
description: |
  All 23 scenarios x 5 quantization levels.
  NOTE: a single vLLM server serves one model build, so the vllm executor
  cannot switch quantization per cell and `safeshift run` refuses this matrix
  on vllm. Serve one endpoint per quantization level and run each level as a
  separate cell, or use executor: mock to test the pipeline.

scenario_paths:
  - scenarios/clinical
  - scenarios/robotic

optimization_paths:
  - optimizations/quantization.yaml

executor: vllm
model: nemotron30b
temperature: 0.0
seed: 42
max_tokens: 4096
n_trials: 1
output_dir: results/nemotron30b-full
