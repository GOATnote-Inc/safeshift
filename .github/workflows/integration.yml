name: Integration (GPU Smoke)

on:
  workflow_dispatch:
    inputs:
      executor:
        description: "Executor to test"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - api
          - vllm
      model:
        description: "Model to test"
        required: false
        default: "mock-model"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Run smoke test
        run: |
          safeshift run \
            --matrix configs/matrices/quick_matrix.yaml \
            --executor ${{ inputs.executor }} \
            --model ${{ inputs.model }} \
            --pattern-only \
            --output results/smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Analyze results
        run: safeshift analyze --results results/smoke/

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-results
          path: results/smoke/
